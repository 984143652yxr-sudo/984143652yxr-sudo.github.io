   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #24292f" x="21.024" y="30.4848" transform="rotate(-0 21.024 30.4848)">A gene is DNA; its expression is measured through RNA</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.024" y="60.4224" transform="rotate(-0 21.024 60.4224)">1  Physical DNA in one donor</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #c05621" transform="translate(55.584 151.538066)">SNP j: A/G</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #c05621" transform="translate(55.584 163.5408)">G-allele dosage = 1</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1768ac" transform="translate(218.398969 151.538066)">Gene g: a DNA locus</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1768ac" transform="translate(207.488812 163.5408)">boxes = simplified exons</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="428.832" y="97.0128" transform="rotate(-0 428.832 97.0128)">Two chromosome copies; one annotated gene locus.</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(428.832 117.6032)">The SNP shown lies outside the gene.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(428.832 133.6032)">Its effect is a question to investigate, not a certainty.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.024" y="216.7632" transform="rotate(-0 21.024 216.7632)">2  Different cells from that donor</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="145.44" y="303.591651" transform="rotate(-0 145.44 303.591651)">DNA</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="145.44" y="241.37856" transform="rotate(-0 145.44 241.37856)">T cell</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(88.319687 362.304679)">Same genotype: G = 1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(89.695469 379.36171)">RNA molecules: M = 6</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(79.851719 394.39296)">Captured / counted: C = 2</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="380.448" y="303.591651" transform="rotate(-0 380.448 303.591651)">DNA</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="380.448" y="241.37856" transform="rotate(-0 380.448 241.37856)">B cell</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(323.327687 362.304679)">Same genotype: G = 1</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(321.522219 379.36171)">RNA molecules: M = 14</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(314.859719 394.39296)">Captured / counted: C = 5</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="515.232" y="256.68" transform="rotate(-0 515.232 256.68)">3  Measurement</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(515.232 275.13984)">RNA capture → barcoding → sequencing</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(515.232 291.93984)">→ alignment → UMI counting</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(515.232 327.76715)">Cell barcode: which cell?</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(515.232 343.2984)">Read alignment: which gene?</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(515.232 359.7984)">UMI: distinguish captured molecules.</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.024" y="486.2016" transform="rotate(-0 21.024 486.2016)">Observed count C is not the number of gene copies and not the total RNA M in the cell.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #57606a" x="21.024" y="519.4656" transform="rotate(-0 21.024 519.4656)">Illustrative schematic, not experimental data. RNA capture is idealized; the assay and processing introduce additional imperfections.</text>
   </g>
