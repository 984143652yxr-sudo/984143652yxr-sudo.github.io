name: Publish study diary
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: python -m pip install -r requirements.txt
      - name: Build and check internal links
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python build.py --base-path "$SITE_BASE_PATH"
          python check_site.py --base-path "$SITE_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
