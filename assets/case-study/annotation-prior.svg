<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Annotation-informed fine-mapping</title><desc id="desc">Genotype and expression define the likelihood. Gene features inform sharing, and SNP features inform activity. Likelihood and prior combine into posterior SNP by cell-type probabilities.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#658697"/></marker></defs>
<rect width="1000" height="390" fill="white"/>
<g font-family="Arial,sans-serif" font-size="19" fill="#253d4c" text-anchor="middle">
<g fill="#f1f7fa" stroke="#c6dce5"><rect x="20" y="30" width="260" height="80" rx="9"/><rect x="355" y="30" width="255" height="80" rx="9"/><rect x="20" y="160" width="260" height="80" rx="9"/><rect x="20" y="270" width="260" height="80" rx="9"/><rect x="355" y="178" width="255" height="150" rx="9"/><rect x="725" y="128" width="255" height="126" rx="9"/></g>
<text x="150" y="63">Genotype + expression</text><text x="150" y="90" font-size="16">Donor × cell-type summaries</text>
<text x="482" y="63">Likelihood</text><text x="482" y="90" font-size="16">LD + sampling covariance</text>
<text x="150" y="194">Gene text embedding</text><text x="150" y="220" font-size="16">Which cell types share effects?</text>
<text x="150" y="303">SNP annotation</text><text x="150" y="330" font-size="16">Which variant is active?</text>
<text x="482" y="214">Annotation-dependent prior</text><text x="482" y="253" font-size="17">Gene → sharing weights ρ</text><text x="482" y="290" font-size="17">SNP → activity probability q</text>
<text x="852" y="165">Posterior</text><text x="852" y="197" font-size="18">SNP × cell-type PIPs</text><text x="852" y="227" font-size="16">Evaluate calibration and sets</text>
</g>
<g stroke="#658697" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M280 70H348"/><path d="M280 200H348"/><path d="M280 310H348"/><path d="M610 70H665V164H718"/><path d="M610 275H665V218H718"/></g>
