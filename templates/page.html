<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title · $name</title>
  <meta name="description" content="$description">
  <link rel="icon" type="image/svg+xml" href="$base/assets/favicon.svg">
  <link rel="stylesheet" href="$base/assets/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="masthead"><div class="header-inner">
  <a class="brand" href="$base/">$name</a>
  <nav aria-label="Main navigation">$navigation</nav>
</div></header>
<div class="layout">
  <aside class="profile" aria-label="About the author">
    <p class="profile-name">$name</p>
    <p class="profile-tagline">$tagline</p>
    <p class="profile-affiliation">$affiliation</p>
    <div class="profile-links">$email<a href="$base/#publications">Publications</a>$github</div>
  </aside>
  <main id="main">$content</main>
</div>
<footer><div>© 2026 $name</div></footer>
</body>
</html>
